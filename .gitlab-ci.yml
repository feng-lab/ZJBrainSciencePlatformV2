stages:
  - test

variables:
  LOG_ROOT: "${CI_PROJECT_DIR}/log"
  FILE_ROOT: "${CI_PROJECT_DIR}/file"
  DEBUG_MODE: "on"
  MYSQL_ROOT_PASSWORD: "zjlab2022root"
  MYSQL_USER: "zjlab"
  MYSQL_PASSWORD: "zjlab2022"
  MYSQL_DATABASE: "zj_brain_science_platform"
  TZ: "Asia/Shanghai"
  KEYCLOAK_URL: "http://keycloak:8080/auth"
  KEYCLOAK_REALM: "test"
  KEYCLOAK_CLIENT_ID: "dataplatform"
  KEYCLOAK_CLIENT_SECRET: "0p9jizKBOrahVzZKzhgW"

services:
  - name: redis:7-alpine
    alias: cache
  - name: caitaozjlab/zjbs-database:latest
    alias: database
    variables:
      MYSQL_ROOT_PASSWORD: zjlab2022root
      MYSQL_USER: zjlab
      MYSQL_PASSWORD: zjlab2022
      MYSQL_DATABASE: zj_brain_science_platform
      TZ: Asia/Shanghai
  - name: quay.io/keycloak/keycloak:latest
    alias: keycloak
    variables:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: dataplatform
      KEYCLOAK_CLIENT_SECRET: 0p9jizKBOrahVzZKzhgW

pytest:
  stage: test
  image: python:3.11
  before_script:
    - pip install pipx
    - pipx install poetry
    - export PATH=$PATH:/root/.local/bin
    - which poetry
    - poetry install --without dev
    - mkdir -p "${LOG_ROOT}" "${FILE_ROOT}"
  script:
    - poetry run alembic upgrade head
    - poetry run pytest --junitxml=pytest_report.xml
  artifacts:
    reports:
      junit: pytest_report.xml



build-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HUB_USERNAME: caitaozjlab
    DOCKER_HUB_PASSWORD: dckr_pat_3vHgyUohktPfh6AkThPE88CUzIs
  script:
    - apk add --no-cache bash
    - |
      baseImageVersion="$(head -n 1 ./deploy/image-version/base.version)"
      baseImageTag="caitaozjlab/zjbs-base:${baseImageVersion}"
      echo "baseImageTag=${baseImageTag}"
    - |
      dateTime="$(date +'%Y%m%d-%H%M%S')"
      gitHash="$(git rev-parse --short=8 HEAD)"
      imageVersion="${dateTime}-${gitHash}"
      echo "imageVersion=${imageVersion}"
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
    - |
      docker buildx build \
        --build-arg BASE_IMAGE_TAG=${baseImageTag} \
        --file ./deploy/dockerfile/platform.Dockerfile \
        --push \
        --tag caitaozjlab/zjbs-platform:${imageVersion} \
        --tag caitaozjlab/zjbs-platform:latest \
        --cache-from type=registry,ref=caitaozjlab/zjbs-platform:latest \
        --cache-to type=inline \
        .
    - |
      echo '# Docker 镜像版本' >> $CI_PROJECT_DIR/build_summary.md
      echo '|Repo|Version|' >> $CI_PROJECT_DIR/build_summary.md
      echo '|---|---|' >> $CI_PROJECT_DIR/build_summary.md
      echo '|`caitaozjlab/zjbs-platform`|`${imageVersion}`|' >> $CI_PROJECT_DIR/build_summary.md
  artifacts:
    paths:
      - build_summary.md
