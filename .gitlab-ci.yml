stages:
  - test
image: docker:20.10.16
services:
  - name: redis:7-alpine
    alias: redis
    command: ["sh", "-c", "redis-server --port 8200"]    
    
  - name: caitaozjlab/zjbs-database:latest
    alias: mysql
    command: ["sh", "-c", "docker-entrypoint.sh mysqld --skip-networking=false --port=8800"]

variables:
  MYSQL_ROOT_PASSWORD: zjlab2022root
  MYSQL_USER: zjlab
  MYSQL_PASSWORD: zjlab2022
  MYSQL_DATABASE: zj_brain_science_platform
  TZ: Asia/Shanghai
  DOCKER_TLS_CERTDIR: "/certs"


pytest:
  stage: test
  image: python:3.8
  services:
    - name: redis:7-alpine
      alias: redis
    - name: mysql
      alias: mysql
  script:
    - apt-get update -y
    - apt-get install -y python3-pip
    - pip install pytest
    - pytest tests/
