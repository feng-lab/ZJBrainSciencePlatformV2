    IMAGE_NAME: my-python-app
    ALIYUN_ACR_USERNAME: 'data-management.acr.robot@zjlab_life_science'
    ALIYUN_ACR_IMAGES_REGISTRY: 'mixbio-images-registry-1-registry.cn-hangzhou.cr.aliyuncs.com'
    DOCKER_REGISTRY_MIRROR: 'https://qdyhe98e.mirror.aliyuncs.com'
    DOCKER_CLIENT_TIMEOUT: 300
    DOCKER_TIMEOUT: 300
  services:
    - docker:20.10.16-dind
#      command: ['--registry-mirror', $DOCKER_REGISTRY_MIRROR]

  before_script:
    - docker login -u $ALIYUN_ACR_USERNAME $ALIYUN_ACR_IMAGES_REGISTRY -p $ALIYUN_ACR_ACCESS_KEY

  script:
    - echo $ALIYUN_ACR_USERNAME
