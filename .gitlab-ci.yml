stages:
  - test

services:
  - name: redis:7-alpine
    alias: redis
    command: ["sh", "-c", "redis-server --port 8200"]
  - name: mysql:latest
    alias: mysql

variables:
  MYSQL_ROOT_PASSWORD: zjlab2022root
  MYSQL_USER: zjlab
  MYSQL_PASSWORD: zjlab2022
  MYSQL_DATABASE: zj_brain_science_platform
  TZ: Asia/Shanghai
  DOCKER_TLS_CERTDIR: "/certs"

before_script:
  # Start Docker service for MySQL container and Redis container
  - docker info # this will check Docker is available
  
  # Start MySQL container
  - docker run -d -p 8800:3306 --name mysql-container -e MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD -e MYSQL_USER=$MYSQL_USER -e MYSQL_PASSWORD=$MYSQL_PASSWORD -e MYSQL_DATABASE=$MYSQL_DATABASE -e TZ=$TZ caitaozjlab/zjbs-database:latest

  # Start Redis container
  - docker run -d -p 8200:6379 --name redis-container redis:7-alpine redis-server --port 6379

pytest:
  stage: test
  image: python:3.8
  services:
    - name: redis:7-alpine
      alias: redis
    - name: mysql
      alias: mysql
  script:
    - apt-get update -y
    - apt-get install -y python3-pip
    - pip install pytest
    - pytest tests/
