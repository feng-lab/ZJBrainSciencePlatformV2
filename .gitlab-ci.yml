stages:
  - test
  - build

variables:
  # MySQL Configuration
  MYSQL_DATABASE: "zj_brain_science_platform"
  MYSQL_ROOT_PASSWORD: "zjlab2022root"
  MYSQL_USER: "zjlab"
  MYSQL_PASSWORD: "zjlab2022"

  # Timezone
  TZ: "Asia/Shanghai"

  # Keycloak Configuration
  KEYCLOAK_URL: "http://keycloak:8080/auth"
  KEYCLOAK_REALM: "test"
  KEYCLOAK_CLIENT_ID: "dataplatform"
  KEYCLOAK_CLIENT_SECRET: "0p9jizKBOrahVzZKzhgW"

  # Cache Configuration
  CACHE_PORT: 6379

services:
  - name: mysql:latest
    alias: database
  - name: redis:7-alpine
    alias: cache
  - name: quay.io/keycloak/keycloak:latest
    alias: keycloak

pytest:
  stage: test
  image: python:3.11
  before_script:
    - pip install pipx
    - pipx install poetry
    - export PATH="$PATH:/root/.local/bin"
    - which poetry
    - poetry install --without dev
    - export DB_HOST="database"
    - export MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}"
    - export MYSQL_USER="${MYSQL_USER}"
    - export MYSQL_PASSWORD="${MYSQL_PASSWORD}"
    - export MYSQL_DATABASE="${MYSQL_DATABASE}"
    - export TZ="${TZ}"
    - export KEYCLOAK_URL="${KEYCLOAK_URL}"
    - export KEYCLOAK_REALM="${KEYCLOAK_REALM}"
    - export KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID}"
    - export KEYCLOAK_CLIENT_SECRET="${KEYCLOAK_CLIENT_SECRET}"
    - export CACHE_PORT="${CACHE_PORT}"
    # 等待数据库服务启动
    - pip install wait-for-it
    - wait-for-it database:3306 -t 60
  script:
    - poetry run alembic upgrade head
    - poetry run pytest --junitxml=pytest_report.xml
  artifacts:
    reports:
      junit: pytest_report.xml


build_docker_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - apk add --no-cache bash
    - baseImageVersion=$(head -n 1 ./deploy/image-version/base.version)
    - baseImageTag="caitaozjlab/zjbs-base:${baseImageVersion}"
    - dateTime=$(date +'%Y%m%d-%H%M%S')
    - gitHash=$(git rev-parse --short=8 HEAD)
    - imageVersion="${dateTime}-${gitHash}"
    - echo "baseImageTag=${baseImageTag}"
    - echo "imageVersion=${imageVersion}"
    - docker login -u caitaozjlab -p dckr_pat_3vHgyUohktPfh6AkThPE88CUzIs
    - docker build -t caitaozjlab/zjbs-platform:${imageVersion} -t caitaozjlab/zjbs-platform:latest -f ./deploy/dockerfile/platform.Dockerfile .
    - docker push caitaozjlab/zjbs-platform:${imageVersion}
    - docker push caitaozjlab/zjbs-platform:latest
  after_script:
    - echo '# Docker 镜像版本' >> docker_image_summary.md
    - echo '|Repo|Version|' >> docker_image_summary.md
    - echo '|---|---|' >> docker_image_summary.md
    - echo '|`caitaozjlab/zjbs-platform`|`${imageVersion}`|' >> docker_image_summary.md
